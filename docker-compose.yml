services:
  mongodb:
    image: mongo:7
    container_name: kiosk-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shop

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kiosk-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://kiosk-mongodb:27017
      VIRTUAL_HOST: shop.dominicatechnologies.com
      VIRTUAL_PORT: 8080
      LETSENCRYPT_HOST: shop.dominicatechnologies.com
      LETSENCRYPT_EMAIL: admin@dominicatechnologies.com
    expose:
      - "8080"
    volumes:
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - product_photos:/app/static/uploads
    networks:
      - shop
      - app-network

volumes:
  mongo_data:
  product_photos:

networks:
  shop:
    external: true
  app-network:
    external: true
